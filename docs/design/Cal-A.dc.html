<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
button{font-family:inherit}
.wk{font-size:12px;font-weight:600;color:#6B6580;text-align:center}
.d{position:relative;height:44px;border:0;border-radius:10px;background:none;color:#1E1A2B;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0}
.d.o{color:#8B8599}
.d.t{box-shadow:inset 0 0 0 1.5px #1E1A2B;font-weight:600}
.d i{position:absolute;bottom:5px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:#1D7A63}
.d i.u{background:#B3204F}
.d.s{background:#1E1A2B;color:#fff;font-weight:600}
.d.s i{background:#fff}
</style>

<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F4F8;color:#1E1A2B;display:flex;flex-direction:column;overflow:hidden">

      <div style="display:flex;gap:6px">
        <button aria-label="Предыдущий месяц" style="width:44px;height:44px;border:1px solid #E2DFEA;border-radius:10px;background:#fff;color:#1E1A2B;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
        <button aria-label="Следующий месяц" style="width:44px;height:44px;border:1px solid #E2DFEA;border-radius:10px;background:#fff;color:#1E1A2B;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #E2DFEA;border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:4px">
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding-bottom:2px">
        <span class="wk">пн</span><span class="wk">вт</span><span class="wk">ср</span><span class="wk">чт</span><span class="wk">пт</span><span class="wk">сб</span><span class="wk">вс</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px">
        <button class="d o">28</button><button class="d o">29</button><button class="d o">30</button><button class="d">1</button><button class="d">2</button><button class="d">3</button><button class="d">4<i></i></button>
        <button class="d">5</button><button class="d">6<i></i></button><button class="d">7<i></i></button><button class="d">8</button><button class="d">9</button><button class="d">10</button><button class="d">11<i></i></button>
        <button class="d">12</button><button class="d">13<i></i></button><button class="d">14<i></i></button><button class="d">15</button><button class="d">16</button><button class="d">17</button><button class="d">18<i></i></button>

      <div style="display:flex;gap:14px;padding:6px 6px 2px;font-size:12px;color:#6B6580">
        <span style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:#1D7A63"></span>есть занятие</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:#B3204F"></span>есть неоплаченные</span>
      </div>
    </div>

    <section style="display:flex;flex-direction:column;gap:8px">
      <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B6580">Вторник, 27 октября</h2>
      <div style="background:#fff;border:1px solid #E2DFEA;border-radius:10px;overflow:hidden">
        <div style="padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-weight:600">Танго · 19:00</span>
            <span style="font-size:13px;color:#6B6580">Оплатили 3 из 4 · не оплатила Динара Р.</span>
          </div>
          <span style="background:#F9E3EA;color:{{accent}};font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap">1 долг</span>
        </div>
        <div style="padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #E2DFEA">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-weight:600">Румба · 20:30</span>
            <span style="font-size:13px;color:#6B6580">Группа пока не собрана · ждут 2</span>
          </div>
          <span style="background:#FBEBCB;color:#9A5600;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap">Набор</span>
        </div>
      </div>
    </section>

    <div style="background:#fff;border:1px solid #E2DFEA;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span style="font-weight:600;font-size:14px">Календарь в телефоне</span>
        <span style="font-size:13px;color:#6B6580">Занятия появятся в приложении «Календарь»</span>
      </div>
      <button style="min-height:44px;padding:0 14px;border:0;border-radius:8px;background:{{accent}};color:#fff;font-weight:600;font-size:14px;white-space:nowrap">Подключить</button>
    </div>
  </div>

  <nav style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-top:1px solid #E2DFEA;padding:6px 2px 14px">
    <a href="#" style="min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#6B6580;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l8-8 8 8M6 10v10h12V10"></path></svg>Сегодня</a>
    <a href="#" style="min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:{{accent}};font-size:11px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Календарь</a>
    <a href="#" style="min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#6B6580;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.5a3.5 3.5 0 010 5M18 14.5c1.8.8 3 2.6 3 5.5"></path></svg>Люди</a>
    <a href="#" style="min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#6B6580;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>Оплаты</a>
    <a href="#" style="min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#6B6580;font-size:11px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>Танцы</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B3204F"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return { accent: this.props.accent ?? '#B3204F' };
  }
}
</script>
</body>
</html>
